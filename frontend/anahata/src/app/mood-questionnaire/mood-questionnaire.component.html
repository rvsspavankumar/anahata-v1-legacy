<div class="questionnaire-wrapper">
  <header class="page-header">
    <h1 class="logo" (click)="goToDashboard()">Anahata</h1>
    <button class="logout-btn" type="button" title="Logoff" (click)="logoff()">⎋</button>
  </header>

  <main class="content">
    <div class="intro-text">
      Let’s understand how you're feeling...
    </div>

    <div class="question-text">
      We’ll start with a few basic questions <span>{{ userName }}</span>... <br />
      Are you able to answer now?
    </div>

    <div class="button-group">
      <button (click)="goToQuestions()">Yes</button>
      <button (click)="goToMoodSelect()">No</button>
    </div>
  </main>
</div>
